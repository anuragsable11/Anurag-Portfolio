<!doctype html>
<!--
  Draws the link-preview images (Open Graph, 1200 × 630) that LinkedIn,
  WhatsApp, Slack and others show when someone shares the site:
    public/og/home.jpg      for the portfolio (index.html)
    public/og/projects.jpg  for the projects page (projects.html)

  Run `npm run dev` in client/, then open
    http://localhost:5173/tools/render-og-images.html?page=home
    http://localhost:5173/tools/render-og-images.html?page=projects
  and capture the 1200 × 630 card at the top left (DevTools → device
  toolbar at 1200 × 630 → "Capture screenshot"), saved as JPEG over the
  files above. Re-run after changing the name, role or projects.

  Everything on the cards comes from src/data/content.js and the site's
  own images, in the site's dark theme.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Render Open Graph images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..500&family=Playfair+Display:wght@400&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #333;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* ---- The portfolio: the hero, as a card ---- */
      .home {
        background: radial-gradient(ellipse 46% 62% at 76% 54%, #1c2230 0%, #0a0a0a 68%) #0a0a0a;
        color: #fafafa;
        font-family: 'Geist', system-ui, sans-serif;
      }

      .home .copy {
        position: absolute;
        left: 76px;
        top: 50%;
        transform: translateY(-50%);
        width: 600px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px 7px 12px;
        border-radius: 99px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1a1a1a;
        font-size: 19px;
        color: #a1a1a1;
      }

      .badge i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #22c55e;
      }

      .name {
        margin-top: 30px;
        font-size: 124px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }

      .name span {
        display: block;
      }

      .name span + span {
        color: #569fff;
      }

      .role {
        margin-top: 30px;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.015em;
        color: #e5e5e5;
      }

      .role b {
        margin-right: 14px;
        font-family: 'Geist Mono', monospace;
        font-weight: 400;
        color: #737373;
      }

      .pipeline {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 38px;
        font-family: 'Geist Mono', monospace;
        font-size: 19px;
        color: #a1a1a1;
      }

      .pipeline span {
        padding: 6px 12px;
        border-radius: 7px;
        background: #1f1f1f;
      }

      .pipeline em {
        font-style: normal;
        color: #525252;
      }

      /* The poster is 3:1 with him in the middle: this puts him at x ≈ 935. */
      .samurai {
        position: absolute;
        right: -650px;
        bottom: -14px;
        height: 610px;
      }

      /* ---- The projects page: its title and its covers ---- */
      .projects {
        background: #000;
        color: #f4f2ef;
        font-family: 'Inter', system-ui, sans-serif;
        perspective: 1400px;
      }

      .projects .wordmark {
        position: absolute;
        left: 64px;
        top: 56px;
        font-family: 'Playfair Display', serif;
        font-size: 30px;
      }

      .projects .wordmark em,
      .projects .who em {
        font-style: normal;
        margin-left: 0.24em;
      }

      .projects h1 {
        position: absolute;
        left: 64px;
        bottom: 120px;
        width: 520px;
        font-family: 'Playfair Display', serif;
        font-weight: 400;
        font-size: 64px;
        line-height: 1.06;
        letter-spacing: -0.005em;
      }

      .projects .role {
        position: absolute;
        left: 64px;
        bottom: 62px;
        margin: 0;
        font-family: 'Inter', sans-serif;
        font-size: 19px;
        font-weight: 300;
        letter-spacing: 0;
        color: rgba(244, 242, 239, 0.62);
      }

      .wall {
        position: absolute;
        left: 610px;
        top: 50%;
        display: grid;
        grid-template-columns: repeat(2, 262px);
        gap: 20px;
        transform: translateY(-50%) rotateY(-22deg) rotateX(4deg);
        transform-origin: 0 50%;
      }

      .wall figure {
        padding: 8px;
        border-radius: 16px;
        background: linear-gradient(160deg, #2a2b31 0%, #141418 42%, #0a0a0c 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.24),
          0 24px 50px rgba(0, 0, 0, 0.7);
      }

      .wall img {
        display: block;
        width: 100%;
        aspect-ratio: 1.6;
        object-fit: cover;
        object-position: 50% 0;
        border-radius: 10px;
      }

      .projects .fade {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 80% at 78% 50%, transparent 55%, rgba(0, 0, 0, 0.55));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="card" class="card"></div>
    <script type="module">
      import { profile, projects, projectsHead } from '/src/data/content.js'
      import poster from '/src/assets/samurai/poster-dark-3000.webp'

      const page = new URLSearchParams(location.search).get('page') === 'projects' ? 'projects' : 'home'
      const card = document.getElementById('card')
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`)
      const [first, last] = profile.name.split(' ')

      if (page === 'home') {
        card.className = 'card home'
        card.innerHTML = `
          <img class="samurai" src="${poster}" alt="" />
          <div class="copy">
            <span class="badge"><i></i>${esc(profile.availability)}</span>
            <h1 class="name"><span>${esc(first)}</span><span>${esc(last)}</span></h1>
            <p class="role"><b>&gt;</b>${esc(profile.role)}</p>
            <div class="pipeline">${['Client', 'API', 'Queue', 'LLM', 'Memory']
              .map((n) => `<span>${n}</span>`)
              .join('<em>→</em>')}</div>
          </div>`
      } else {
        card.className = 'card projects'
        const covers = projects.filter((p) => p.showcase).slice(0, 6)
        card.innerHTML = `
          <div class="wall">${covers
            .map((p) => `<figure><img src="${p.showcase.imageSmall}" alt="" /></figure>`)
            .join('')}</div>
          <div class="fade"></div>
          <div class="wordmark">${esc(first)}<em>${esc(last)}</em></div>
          <h1>${esc(`${projectsHead.title} ${projectsHead.highlight}`)}</h1>
          <p class="role">${esc(profile.role)}</p>`
      }

      // Ready once the fonts and every image have arrived.
      await document.fonts.ready
      await Promise.all([...card.querySelectorAll('img')].map((img) => img.decode().catch(() => {})))
      document.body.dataset.ready = ''
    </script>
  </body>
</html>
