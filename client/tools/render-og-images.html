<!doctype html>
<!--
  Draws the link-preview images (Open Graph, 1200 × 630) that LinkedIn,
  WhatsApp, Slack and others show when someone shares the site:
    public/og/home.jpg      for the portfolio (index.html)
    public/og/projects.jpg  for the projects page (projects.html)

  Run `npm run dev` in client/, then open
    http://localhost:5173/tools/render-og-images.html?page=home
    http://localhost:5173/tools/render-og-images.html?page=projects
  and capture the 1200 × 630 card at the top left (DevTools → device
  toolbar at 1200 × 630 → "Capture screenshot"), saved as JPEG over the
  files above. Re-run after changing the name, role or projects.

  Everything on the cards comes from src/data/content.js and the site's
  own images: the portfolio's in its light theme (navy and teal on soft
  white), the projects page's in its own black.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Render Open Graph images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&family=Shippori+Mincho:wght@500;700&family=Playfair+Display:wght@400&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #333;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* ---- The portfolio: the hero, as a card ---- */
      /* The site's light theme: washi paper, the name in Mincho, ink then
         red, what I do in spaced capitals, and my photo on its plain paper
         card, as the hero shows them. */
      .home {
        background: #f6f3ec;
        color: #1c1b19;
        font-family: 'Montserrat', system-ui, sans-serif;
      }

      .home .copy {
        position: absolute;
        left: 76px;
        top: 50%;
        transform: translateY(-50%);
        width: 600px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #6b655c;
      }

      .badge i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #b7282e;
      }

      .name {
        margin-top: 22px;
        font-family: 'Shippori Mincho', serif;
        font-size: 138px;
        font-weight: 500;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: #1c1b19;
      }

      .name span {
        display: block;
      }

      .name span + span {
        color: #b7282e;
      }

      .role {
        margin-top: 30px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #1c1b19;
      }

      .photo {
        position: absolute;
        right: 84px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        width: 400px;
        height: 500px;
        overflow: hidden;
        border-radius: 6px;
        background: #ece5d8;
        box-shadow: 0 10px 28px -14px rgba(28, 27, 25, 0.2);
      }

      .photo img {
        display: block;
        width: 92%;
        filter: drop-shadow(0 16px 22px rgba(28, 27, 25, 0.28));
      }

      /* ---- The projects page: its title and its covers ---- */
      .projects {
        background: #000;
        color: #f4f2ef;
        font-family: 'Inter', system-ui, sans-serif;
        perspective: 1400px;
      }

      .projects .wordmark {
        position: absolute;
        left: 64px;
        top: 56px;
        font-family: 'Playfair Display', serif;
        font-size: 30px;
      }

      .projects .wordmark em,
      .projects .who em {
        font-style: normal;
        margin-left: 0.24em;
      }

      .projects h1 {
        position: absolute;
        left: 64px;
        bottom: 120px;
        width: 520px;
        font-family: 'Playfair Display', serif;
        font-weight: 400;
        font-size: 64px;
        line-height: 1.06;
        letter-spacing: -0.005em;
      }

      .projects .role {
        position: absolute;
        left: 64px;
        bottom: 62px;
        margin: 0;
        font-family: 'Inter', sans-serif;
        font-size: 19px;
        font-weight: 300;
        letter-spacing: 0;
        color: rgba(244, 242, 239, 0.62);
      }

      .wall {
        position: absolute;
        left: 610px;
        top: 50%;
        display: grid;
        grid-template-columns: repeat(2, 262px);
        gap: 20px;
        transform: translateY(-50%) rotateY(-22deg) rotateX(4deg);
        transform-origin: 0 50%;
      }

      .wall figure {
        padding: 8px;
        border-radius: 16px;
        background: linear-gradient(160deg, #2a2b31 0%, #141418 42%, #0a0a0c 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.24),
          0 24px 50px rgba(0, 0, 0, 0.7);
      }

      .wall img {
        display: block;
        width: 100%;
        aspect-ratio: 1.6;
        object-fit: cover;
        object-position: 50% 0;
        border-radius: 10px;
      }

      .projects .fade {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 80% at 78% 50%, transparent 55%, rgba(0, 0, 0, 0.55));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="card" class="card"></div>
    <script type="module">
      import { profile, projects, projectsHead } from '/src/data/content.js'
      import portrait from '/src/assets/portrait.webp'

      const page = new URLSearchParams(location.search).get('page') === 'projects' ? 'projects' : 'home'
      const card = document.getElementById('card')
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`)
      const [first, last] = profile.name.split(' ')

      if (page === 'home') {
        card.className = 'card home'
        card.innerHTML = `
          <div class="photo"><img src="${portrait}" alt="" /></div>
          <div class="copy">
            <span class="badge"><i></i>${esc(profile.availability)}</span>
            <h1 class="name"><span>${esc(first)}</span><span>${esc(last)}</span></h1>
            <p class="role">${esc(profile.role)}</p>
          </div>`
      } else {
        card.className = 'card projects'
        const covers = projects.filter((p) => p.showcase).slice(0, 6)
        card.innerHTML = `
          <div class="wall">${covers
            .map((p) => `<figure><img src="${p.showcase.imageSmall}" alt="" /></figure>`)
            .join('')}</div>
          <div class="fade"></div>
          <div class="wordmark">${esc(first)}<em>${esc(last)}</em></div>
          <h1>${esc(`${projectsHead.title} ${projectsHead.highlight}`)}</h1>
          <p class="role">${esc(profile.role)}</p>`
      }

      // Ready once the fonts and every image have arrived.
      await document.fonts.ready
      await Promise.all([...card.querySelectorAll('img')].map((img) => img.decode().catch(() => {})))
      document.body.dataset.ready = ''
    </script>
  </body>
</html>
