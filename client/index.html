<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <title>Anurag Sable — Backend &amp; Agentic AI Engineer</title>
    <meta
      name="description"
      content="Anurag Sable — Computer Science &amp; Engineering graduate building LLM-integrated backend systems with Python, Django, FastAPI, RAG pipelines and async orchestration."
    />
    <meta name="author" content="Anurag Sable" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anurag Sable — Backend &amp; Agentic AI Engineer" />
    <meta
      property="og:description"
      content="Backend engineering for AI-driven systems: LLM orchestration, RAG pipelines, and async task pipelines in Python."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
