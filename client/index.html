    <!-- The site URL in these tags is filled in at build time (see prerender.js). -->
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anurag Sable" />
    <meta property="og:url" content="%SITE_URL%/" />

      content="I build the backend for AI apps with Python, Django and FastAPI. Open to work."

    <meta property="og:image" content="%SITE_URL%/og/home.jpg" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- For search engines: this site is Anurag Sable's, and this page is
         his profile, with the facts that tie the name to him (keep in step
         with profile and timeline in src/data/content.js). sameAs links his
         other profiles, so a search for the name can find them together. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Anurag Sable",
            "alternateName": "Anurag Sable Portfolio",
            "publisher": { "@id": "%SITE_URL%/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "%SITE_URL%/#profile",
            "url": "%SITE_URL%/",
            "name": "Anurag Sable — Backend & Agentic AI Engineer",
            "isPartOf": { "@id": "%SITE_URL%/#website" },
            "mainEntity": { "@id": "%SITE_URL%/#person" }
          },
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#person",
            "name": "Anurag Sable",
            "givenName": "Anurag",
            "familyName": "Sable",
            "jobTitle": "Backend & Agentic AI Engineer",
            "description": "Computer Science graduate who builds the backend for AI apps with Python, Django and FastAPI.",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og/home.jpg",
            "worksFor": { "@type": "Organization", "name": "Shubham Tanks and Liners Pvt Ltd" },
            "alumniOf": [
              { "@type": "CollegeOrUniversity", "name": "ARMIET College, Thane" },
              { "@type": "CollegeOrUniversity", "name": "University of Mumbai" }
            ],
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Thane",
              "addressRegion": "Maharashtra",
              "addressCountry": "IN"
            },
            "knowsAbout": ["Python", "Django", "FastAPI", "REST APIs", "Agentic AI", "LLMs", "PostgreSQL", "Docker"],
            "sameAs": ["https://linkedin.com/in/anurag-sable-4181382a6/", "https://github.com/anuragsable11"]
          }
        ]
      }
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <noscript>
      <style>
        /* The page is prerendered at the first frame of its entrance
           animations; without JavaScript, show it as they would leave it. */
        #root [style*='opacity:0'] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
